name: Release Deploy Maven
run-name: Deploy to Maven Central - v${{ inputs.version }}${{ inputs.dry_run && ' (Dry Run)' || '' }}
permissions:
  contents: write
  packages: write
  id-token: write
env:
  MAVEN_VERSION: 3.9.2
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  deploy-maven-production:
    name: Deploy to Maven Central (Production)
    runs-on: ubuntu-22.04
    if: ${{ inputs.dry_run == false }}
    steps:
    - name: Download release assets
      uses: robinraju/release-downloader@v1.12
      with:
        repository: liquibase/liquibase
        tag: ${{ inputs.tag }}
        fileName: '*'
        out-file-path: .
    - name: Configure AWS credentials for vault access
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
        aws-region: us-east-1
    - name: Get secrets from vault
      id: vault-secrets
      uses: aws-actions/aws-secretsmanager-get-secrets@v2
      with:
        secret-ids: |
          ,/vault/liquibase
        parse-json-secrets: true
    - name: Convert escaped newlines and set GPG key
      run: |
        {
          echo "GPG_KEY_CONTENT<<GPG_EOF"
          printf '%b' "${{ env.GPG_SECRET }}"
          echo
          echo "GPG_EOF"
        } >> $GITHUB_ENV
    - name: Set up Java for publishing to Maven Central Repository
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: temurin
        server-id: sonatype-nexus-staging
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ env.GPG_KEY_CONTENT }}
        gpg-passphrase: GPG_PASSPHRASE
      env:
        GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}
    - name: Publish to Maven Central
      env:
        MAVEN_USERNAME: ${{ env.SONATYPE_USERNAME }}
        MAVEN_PASSWORD: ${{ env.SONATYPE_TOKEN }}
        GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}
      run: "version=${{ inputs.version }}\n\nunzip -j liquibase-additional-*.zip\n\n##extracts and sign poms, generate checksums for all artifacts\nfor i in 'liquibase-core' 'liquibase-maven-plugin' 'liquibase-cli'; do\n  unzip -j $i-${version}.jar META-INF/maven/org.liquibase/$i/pom.xml\n  sed -i -e \"s/<version>\\(release\\|master\\)-SNAPSHOT<\\/version>/<version>${version}<\\/version>/\" pom.xml\n  mv pom.xml $i-${version}.pom\n\n  # Sign POM file\n  gpg --batch --pinentry-mode=loopback --passphrase \"$GPG_PASSWORD\" -ab $i-${version}.pom\n  \n  # Generate checksums for POM file\n  md5sum $i-${version}.pom | cut -d' ' -f1 > $i-${version}.pom.md5\n  sha1sum $i-${version}.pom | cut -d' ' -f1 > $i-${version}.pom.sha1\n  \n  # Generate checksums for all JAR files (main, sources, javadoc)\n  for jar_file in $i-${version}.jar $i-${version}-sources.jar $i-${version}-javadoc.jar; do\n    if [ -f \"$jar_file\" ]; then\n      md5sum \"$jar_file\" | cut -d' ' -f1 > \"$jar_file.md5\"\n      sha1sum \"$jar_file\" | cut -d' ' -f1 > \"$jar_file.sha1\"\n    fi\n  done\ndone\n\n# Create Maven repository layout structure for the bundle\nmkdir -p \"bundle/org/liquibase\"\n\n# Copy all artifacts to proper Maven repository layout\nfor i in 'liquibase-core' 'liquibase-maven-plugin' 'liquibase-cli'; do\n  mkdir -p \"bundle/org/liquibase/$i/${version}\"\n  cp $i-${version}* \"bundle/org/liquibase/$i/${version}/\"\ndone\n\n# Create the bundle zip file\ncd bundle\nzip -r ../central-bundle.zip .\ncd ..\n\n# Create base64 encoded credentials for Bearer auth\nAUTH_HEADER=$(printf \"%s:%s\" \"${MAVEN_USERNAME}\" \"${MAVEN_PASSWORD}\" | base64 -w 0)\n\n# Upload bundle to Central Portal with AUTOMATIC publishing\necho \"Uploading bundle to Central Portal for liquibase-${version}...\"\nUPLOAD_RESPONSE=$(curl -s -w \"\\n%{http_code}\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${AUTH_HEADER}\" \\\n  -F \"bundle=@central-bundle.zip\" \\\n  \"https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=liquibase-${version}\")\n\n# Parse response\nHTTP_CODE=$(echo \"$UPLOAD_RESPONSE\" | tail -n1)\nDEPLOYMENT_ID=$(echo \"$UPLOAD_RESPONSE\" | head -n1)\n\necho \"HTTP Status: $HTTP_CODE\"\necho \"Deployment ID: $DEPLOYMENT_ID\"\n\nif [ \"$HTTP_CODE\" != \"201\" ]; then\n  echo \"Upload failed with HTTP status $HTTP_CODE\"\n  echo \"Response: $DEPLOYMENT_ID\"\n  exit 1\nfi\n\necho \"Bundle uploaded successfully to Central Portal\"\necho \"Deployment ID: $DEPLOYMENT_ID\"\necho \"Automatic publishing initiated for liquibase-${version}\"\n"
  deploy-maven-dryrun:
    name: Deploy to Maven Central (Dry Run)
    runs-on: ubuntu-22.04
    if: ${{ inputs.dry_run == true }}
    steps:
    - name: Download dry-run release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Use gh CLI which handles draft release auth correctly
        gh release download "${{ inputs.tag }}" \
          --repo liquibase/liquibase \
          --pattern "*" \
          --dir "."
    - name: Configure AWS credentials for vault access
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
        aws-region: us-east-1
    - name: Get secrets from vault
      id: vault-secrets
      uses: aws-actions/aws-secretsmanager-get-secrets@v2
      with:
        secret-ids: |
          ,/vault/liquibase
        parse-json-secrets: true
    - name: Convert escaped newlines and set GPG key
      run: |
        {
          echo "GPG_KEY_CONTENT<<GPG_EOF"
          printf '%b' "${{ env.GPG_SECRET }}"
          echo
          echo "GPG_EOF"
        } >> $GITHUB_ENV
    - name: Set up Java for publishing to Maven Central Repository
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: temurin
        server-id: dry-run-sonatype-nexus-staging
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ env.GPG_KEY_CONTENT }}
        gpg-passphrase: GPG_PASSPHRASE
      env:
        GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}
    - name: Publish to Central Portal (Dry Run)
      env:
        MAVEN_USERNAME: ${{ env.SONATYPE_USERNAME }}
        MAVEN_PASSWORD: ${{ env.SONATYPE_TOKEN }}
        GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}
      run: "version=${{ inputs.version }}\n\nunzip -j liquibase-additional-*.zip\n\n##extracts and sign poms, generate checksums for all artifacts\nfor i in 'liquibase-core' 'liquibase-maven-plugin' 'liquibase-cli'; do\n  unzip -j $i-${version}.jar META-INF/maven/org.liquibase/$i/pom.xml\n  sed -i -e \"s/<version>\\(release\\|master\\)-SNAPSHOT<\\/version>/<version>${version}<\\/version>/\" pom.xml\n  mv pom.xml $i-${version}.pom\n\n  # Sign POM file\n  gpg --batch --pinentry-mode=loopback --passphrase \"$GPG_PASSWORD\" -ab $i-${version}.pom\n  \n  # Generate checksums for POM file\n  md5sum $i-${version}.pom | cut -d' ' -f1 > $i-${version}.pom.md5\n  sha1sum $i-${version}.pom | cut -d' ' -f1 > $i-${version}.pom.sha1\n  \n  # Generate checksums for all JAR files (main, sources, javadoc)\n  for jar_file in $i-${version}.jar $i-${version}-sources.jar $i-${version}-javadoc.jar; do\n    if [ -f \"$jar_file\" ]; then\n      md5sum \"$jar_file\" | cut -d' ' -f1 > \"$jar_file.md5\"\n      sha1sum \"$jar_file\" | cut -d' ' -f1 > \"$jar_file.sha1\"\n    fi\n  done\ndone\n\n# Create Maven repository layout structure for the bundle\nmkdir -p \"bundle/org/liquibase\"\n\n# Copy all artifacts to proper Maven repository layout\nfor i in 'liquibase-core' 'liquibase-maven-plugin' 'liquibase-cli'; do\n  mkdir -p \"bundle/org/liquibase/$i/${version}\"\n  cp $i-${version}* \"bundle/org/liquibase/$i/${version}/\"\ndone\n\n# Create the bundle zip file\ncd bundle\nzip -r ../central-bundle.zip .\ncd ..\n\n# Create base64 encoded credentials for Bearer auth\nAUTH_HEADER=$(printf \"%s:%s\" \"${MAVEN_USERNAME}\" \"${MAVEN_PASSWORD}\" | base64 -w 0)\n\n# Upload bundle to Central Portal with USER_MANAGED publishing (dry run)\necho \"Uploading bundle to Central Portal for dry-run liquibase-${version}...\"\nUPLOAD_RESPONSE=$(curl -s -w \"\\n%{http_code}\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${AUTH_HEADER}\" \\\n  -F \"bundle=@central-bundle.zip\" \\\n  \"https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED&name=liquibase-${version}-dry-run\")\n\n# Parse response\nHTTP_CODE=$(echo \"$UPLOAD_RESPONSE\" | tail -n1)\nDEPLOYMENT_ID=$(echo \"$UPLOAD_RESPONSE\" | head -n1)\n\necho \"HTTP Status: $HTTP_CODE\"\necho \"Deployment ID: $DEPLOYMENT_ID\"\n\nif [ \"$HTTP_CODE\" != \"201\" ]; then\n  echo \"Upload failed with HTTP status $HTTP_CODE\"\n  echo \"Response: $DEPLOYMENT_ID\"\n  exit 1\nfi\n\necho \"Bundle uploaded successfully to Central Portal for dry-run\"\necho \"Deployment ID: $DEPLOYMENT_ID\"\necho \"Manual publishing required - visit https://central.sonatype.com/publishing/deployments to review and publish\"\n"
on:
  workflow_call:
    inputs:
      version:
        description: Version to deploy
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
      dry_run:
        description: Flag to indicate if this is a dry-run deployment
        required: false
        type: boolean
        default: false
      dry_run_release_id:
        description: The release id of the dry-run release
        required: false
        type: string
        default: ''
      dry_run_assets_url:
        description: URL pattern for downloading dry-run release assets
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
      dry_run:
        description: Flag to indicate if this is a dry-run deployment
        required: false
        type: boolean
        default: false
      dry_run_release_id:
        description: The release id of the dry-run release
        required: false
        type: string
        default: ''
      dry_run_assets_url:
        description: URL pattern for downloading dry-run release assets
        required: false
        type: string
        default: ''
